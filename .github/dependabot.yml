# Dependabot schlaegt woechentlich Aktualisierungen fuer NuGet-Pakete und
# GitHub-Aktionen vor.
#
# Wichtig: Vorschlaege von Dependabot werden nicht ungeprueft uebernommen.
# Ein Pull Request von Dependabot wird erst zusammengefuehrt, wenn der
# CI-Lauf gruen ist und die Aenderung (Versionshinweise, bei Aktionen der
# neue Commit-Hash) angesehen wurde.

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          # Werkzeug fuer Migrationen (dotnet-tools.json), gehoert versionsgleich
          # zu Microsoft.EntityFrameworkCore.
          - "dotnet-ef"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
